[package]
name = "alopex-skulk"
version = "0.2.0"
edition = "2021"
description = "Alopex Skulk - Time Series Storage Engine"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/alopex-db/alopex-skulk"
homepage = "https://github.com/alopex-db/alopex-skulk"
documentation = "https://docs.rs/alopex-skulk"
keywords = ["time-series", "database", "storage", "tsdb", "alopex"]
categories = ["database", "data-structures"]
readme = "README.md"

[features]
default = []

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Protocol parsing (official InfluxData parser; pure Rust)
influxdb-line-protocol = { version = "=2.0.0", default-features = false }
prost = { version = "=0.13.5", default-features = false, features = ["derive", "std"] }
snap = { version = "=1.1.1", default-features = false }

# Columnar storage (pure Rust; depend only on the Arrow components we use)
arrow-array = { version = "=55.2.0", default-features = false }
arrow-schema = { version = "=55.2.0", default-features = false }
arrow-select = { version = "=55.2.0", default-features = false }
parquet = { version = "=55.2.0", default-features = false, features = ["arrow", "brotli"] }

# Error handling
thiserror = { workspace = true }

# Compression and checksums
crc32fast = { workspace = true }
fs2 = "0.4"
xxhash-rust = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "ingest_bench"
harness = false
