[package]
name = "alopex-skulk"
version = "0.4.0"
edition = "2021"
description = "Alopex Skulk - Time Series Storage Engine"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/alopex-db/alopex-skulk"
homepage = "https://github.com/alopex-db/alopex-skulk"
documentation = "https://docs.rs/alopex-skulk"
keywords = ["time-series", "database", "storage", "tsdb", "alopex"]
categories = ["database", "data-structures"]
readme = "README.md"
# links: the Nim query-parser shared library (vendored per target under
# crates/skulk/nim-parser/vendor/). A distinct links value from alopex-sql's
# "alopex_sql_parser" avoids a duplicate-links conflict if both crates ever
# share a dependency graph. build.rs publishes cargo::metadata=libdir so the
# final binary's build script can set an rpath (DEP_SKULK_NIM_PARSER_LIBDIR).
links = "skulk_nim_parser"

[features]
# Text query frontends (spec skulk-v0-4, rulings D1/D2). The core profile
# (--no-default-features) stays pure Rust with zero C/Nim artifacts.
default = ["promql", "sql-ts"]
promql = ["dep:rmp-serde"]
sql-ts = ["dep:rmp-serde"]

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Protocol parsing (official InfluxData parser; pure Rust)
influxdb-line-protocol = { version = "=2.0.0", default-features = false }
prost = { version = "=0.13.5", default-features = false, features = ["derive", "std"] }
snap = { version = "=1.1.1", default-features = false }

# Columnar storage (pure Rust; depend only on the Arrow components we use)
arrow-array = { version = "=55.2.0", default-features = false }
arrow-schema = { version = "=55.2.0", default-features = false }
arrow-select = { version = "=55.2.0", default-features = false }
parquet = { version = "=55.2.0", default-features = false, features = ["arrow", "brotli"] }

# Query layer (core; pure Rust). Size/DFA limits are configured at runtime
# via RegexBuilder so hostile patterns are bounded (spec Req1 AC8).
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode"] }

# Nim parser FFI bridge payloads (feature-gated; not part of the core profile)
rmp-serde = { version = "1.3", optional = true }

# Error handling
thiserror = { workspace = true }

# Compression and checksums
crc32fast = { workspace = true }
fs2 = "0.4"
xxhash-rust = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "ingest_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[example]]
name = "query_footprint"
path = "examples/query_footprint.rs"
required-features = ["promql", "sql-ts"]

[[test]]
name = "build_script_contract"
path = "build_support.rs"
