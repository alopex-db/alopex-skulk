name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  NIM_SQL_PARSER_DIR: .ci/alopex/crates/alopex-sql/nim-sql-parser
  PARSER_CONSUMER_DESCRIPTOR: crates/skulk/nim-parser/parser-consumer.json

jobs:
  # Check code formatting
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: crates/skulk

  # Run clippy lints
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: crates/skulk

  # Build and test on multiple platforms
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # Only run beta on Linux to save CI time
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta

    steps:
      - uses: actions/checkout@v4

      - name: Read parser consumer descriptor
        id: parser-consumer
        shell: bash
        run: |
          descriptor="${GITHUB_WORKSPACE}/${PARSER_CONSUMER_DESCRIPTOR}"
          mode="$(jq -er '.active_mode' "$descriptor")"
          [[ "$mode" == "legacy" ]] || {
            echo "CI source acquisition requires legacy parser mode, got $mode" >&2
            exit 1
          }
          echo "source-repository=$(jq -er '.legacy.source_repository' "$descriptor")" >> "$GITHUB_OUTPUT"
          echo "source-ref=$(jq -er '.legacy.source_ref' "$descriptor")" >> "$GITHUB_OUTPUT"
          echo "contract-version=$(jq -er '.legacy.contract_version' "$descriptor")" >> "$GITHUB_OUTPUT"

      # Linux uses the checked-in, checksum-verified parser artifact. macOS
      # and Windows build the same pinned Nim source used by Alopex CI.
      - name: Checkout Alopex Nim parser source
        if: runner.os != 'Linux'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parser-consumer.outputs.source-repository }}
          ref: ${{ steps.parser-consumer.outputs.source-ref }}
          path: .ci/alopex
          persist-credentials: false

      - name: Setup Nim
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nim SQL parser library
        if: runner.os != 'Linux'
        shell: bash
        run: bash .ci/alopex/scripts/build-nim-parser.sh --backend host

      - name: Run Nim SQL parser tests
        if: runner.os != 'Linux'
        shell: bash
        run: bash .ci/alopex/scripts/test-nim-parser.sh --backend host

      - name: Configure Nim SQL parser for Skulk
        if: runner.os != 'Linux'
        shell: bash
        run: |
          parser_dir="${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}"
          test -f "${parser_dir}/CONTRACT_VERSION"
          test -f "${parser_dir}/SHA256SUMS"
          expected_contract="${{ steps.parser-consumer.outputs.contract-version }}"
          actual_contract="$(tr -d '\r\n' < "${parser_dir}/CONTRACT_VERSION")"
          [[ "$actual_contract" == "$expected_contract" ]] || {
            echo "generated parser contract $actual_contract does not match descriptor $expected_contract" >&2
            exit 1
          }
          echo "SKULK_NIM_PARSER_LIB_DIR=${parser_dir}" >> "$GITHUB_ENV"

      - name: Add Nim SQL parser to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-features
        working-directory: crates/skulk

      - name: Run tests
        run: cargo test --all-features
        working-directory: crates/skulk

      - name: Run doc tests
        run: cargo test --doc
        working-directory: crates/skulk

  # Run integration tests separately (they may be slower)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run integration tests
        run: cargo test --test '*' --all-features
        working-directory: crates/skulk

  # Build documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        working-directory: crates/skulk
        env:
          RUSTDOCFLAGS: -D warnings

  # Check for security vulnerabilities in dependencies
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        working-directory: crates/skulk
        continue-on-error: true  # Advisory: don't fail the build on new vulns

  # MSRV (Minimum Supported Rust Version) check
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.82.0 (MSRV)
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Check MSRV compatibility
        run: cargo check --all-features
        working-directory: crates/skulk

  # Final check that all jobs passed
  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, integration, docs, security, msrv]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
